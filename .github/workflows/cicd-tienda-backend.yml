name: CI/CD Tienda Perritos - Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Backend a ECR
        run: |
          docker build -t tienda-backend ./backend
          docker tag tienda-backend:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:latest

      - name: Desplegar Backend en EC2 vía SSM
        id: ssm_backend
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy tienda-backend desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL_BACKEND }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}:latest",
              "docker stop tienda-backend || true",
              "docker rm tienda-backend || true",
              "docker run -d --name tienda-backend --restart unless-stopped -p 3001:3001 -e DB_HOST=${{ secrets.DB_HOST }} -e DB_USER=root -e DB_PASSWORD=admin123 -e DB_NAME=tienda_perritos ${{ secrets.ECR_REPO_URL_BACKEND }}:latest"
            ]}' \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Verificar resultado del despliegue Backend
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm_backend.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_backend.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query "Status" \
            --output text)
          echo "Estado del comando SSM: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue falló con estado: $STATUS"
            exit 1
          fi