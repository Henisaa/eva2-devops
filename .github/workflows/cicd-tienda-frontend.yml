name: CI/CD Proyecto semestral - Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Frontend a ECR
        run: |
          docker build \
            --build-arg VITE_API_VENTAS_URL="" \
            --build-arg VITE_API_DESPACHOS_URL="" \
            -t tienda-frontend ./frontend
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Desplegar Frontend en EC2 vía SSM
        id: ssm_frontend
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08517e7f8a68f24f2" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy tienda-frontend desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL_FRONTEND }}",
              "docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest",
              "docker stop tienda-frontend || true",
              "docker rm tienda-frontend || true",
              "docker run -d --name tienda-frontend --restart unless-stopped -p 80:80 ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest"
            ]}' \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Verificar resultado del despliegue Frontend
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm_frontend.outputs.command_id }}" \
            --instance-id "i-08517e7f8a68f24f2"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_frontend.outputs.command_id }}" \
            --instance-id "i-08517e7f8a68f24f2" \
            --query "Status" \
            --output text)
          echo "Estado del comando SSM: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue falló con estado: $STATUS"
            exit 1
          fi
