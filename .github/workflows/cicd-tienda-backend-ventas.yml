name: CI/CD - Backend Ventas (Spring Boot)

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend-ventas/**"
  workflow_dispatch:

jobs:
  build-push-deploy-backend-ventas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Backend Ventas a ECR
        run: |
          docker build -t backend-ventas ./backend-ventas
          docker tag backend-ventas:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest

      - name: Desplegar Backend Ventas en EC2 vía SSM
        id: ssm_backend_ventas
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ac3bca684ff618a4" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend-ventas desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL_BACKEND }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest",
              "docker stop backend-ventas || true",
              "docker rm backend-ventas || true",
              "docker run -d --name backend-ventas --restart unless-stopped -p 8080:8080 -e DB_ENDPOINT=${{ secrets.DB_HOST }} -e DB_PORT=3306 -e DB_NAME=tienda_semestral -e DB_USERNAME=root -e DB_PASSWORD=admin123 ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest"
            ]}' \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Verificar resultado del despliegue Backend Ventas
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm_backend_ventas.outputs.command_id }}" \
            --instance-id "i-0ac3bca684ff618a4"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm_backend_ventas.outputs.command_id }}" \
            --instance-id "i-0ac3bca684ff618a4" \
            --query "Status" \
            --output text)
          echo "Estado del comando SSM: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue falló con estado: $STATUS"
            exit 1
          fi
